# ==============================================================================
# ST-MAE Pre-training Configuration
# ==============================================================================
# ST-MAE (Choi et al., Temporal Graph Learning Workshop @ NeurIPS 2023):
# masked autoencoder that reconstructs input node embeddings and edges
# of dynamic brain graphs across space and time.
#
# Usage:
#   python pretrain.py --config configs/pretrain_stmae.yaml \
#                      --data_dir ./data --output_dir ./output_pt
# ==============================================================================

# --- Basic ---
seed: 0
train_k: 0                         # Fold index for cross-validation
k_fold: 5                          # Number of folds

# --- Dataset ---
dataset: ukb-rest                   # Dataset name (must match data directory)
target_feature: 31-0.0              # Target variable (used for stratified splits)
roi: schaefer                       # Brain atlas: schaefer, aal, destrieux, harvard_oxford
regression: false

# --- Temporal Windowing ---
window_size: 50                     # Sliding window size for FC computation
window_stride: 16                   # Stride between windows
dynamic_length: 400                 # Total BOLD signal length to use
static: false                       # true: single static FC, false: dynamic FC

# --- Model Architecture ---
encoder_type: gin                   # Graph encoder: gin (GIN) or gat (GAT)
num_layers: 4                       # Number of GNN layers
hidden_dim: 128                     # Hidden dimension
sparsity: 30                        # Top-k% for adjacency sparsification
dropout: 0.5
readout: sero                       # Spatial readout: sero, garo, mean
cls_token: sum                      # Temporal aggregation: sum, mean, param
num_heads: 1                        # Attention heads for readout
time_aggregation: mean              # Temporal encoder: mean, transformer, gru
use_time_encoding: false            # Add GRU-based temporal positional encoding
not_use_time_encoding: false

# --- Optimization ---
lr: 0.0005
wd: 0.0001                         # Weight decay
reg_lambda: 0.0                    # Orthogonal regularization weight
clip_grad: 0.0                     # Gradient clipping (0 = disabled)
num_epochs: 5
minibatch_size: 16
eval_minibatch_size: 1
scheduler_type: cosinedecay         # cosinedecay, constant, cawr

# --- Training ---
num_workers: 4
drop_last: true
validate: true
validate_freq: 1
val_ratio: 0.1                      # Fraction for validation split
skip_zeroshot: true

# ==============================================================================
# SSL: ST-MAE Configuration
# ==============================================================================
ssl: true
ssl_type: stmae
ssl_lambda_total: 1.0               # Overall SSL loss weight
ema_update: false                   # ST-MAE reconstructs the input; no target encoder

# --- Masking ---
node_mask_rate: 0.3                 # Fraction of nodes masked at each timepoint
edge_mask_rate: 0.3                 # Fraction of edges removed from message passing

# --- Node Reconstruction ---
recon_node: true
ssl_lambda_node: 1.0
node_decoder_hidden_dim_factor: 2.0
node_recon_loss_type: sce
node_alpha_l: 2

# --- Edge Reconstruction ---
recon_edge: true
ssl_lambda_edge: 1.0
edge_decoder_hidden_dim_factor: 2.0
edge_recon_loss_type: bce
edge_alpha_l: 2

# --- Spatial-Temporal Objectives ---
self_loop_rate: 0.5                 # Balance: rate * spatial + (1-rate) * temporal
min_temporal_dist: null             # null = window_size // window_stride + 1

# --- Data Split (for UKB SSL setting) ---
same_data_ssl_setting: true           # Use fold-0 train for SSL, fold-0 test for finetune
ssl_test_ratio: 0.1
num_finetune_subsample: 0
